services:
  nginx-proxy-manager:
    image: jc21/nginx-proxy-manager:2.16.0
    container_name: nginx-proxy
    restart: always
    ports:
      - "80:80"
      - "81:81"
      - "443:443"
    volumes:
      - ../../data/nginx-proxy-manager:/data
      - ../../data/letsencrypt:/etc/letsencrypt
    networks:
      - homelab

networks:
  homelab:
    external: true
