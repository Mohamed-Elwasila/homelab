version: "3"

services:
  nginx-proxy-manager:
    image: jc21/nginx-proxy-manager:latest
    container_name: nginx-proxy
    restart: always
    ports:
      - "80:80"
      - "81:81"
      - "443:443"
    volumes:
      - /home/mujtaba/homelab/data/nginx-proxy-manager:/data
      - /home/mujtaba/homelab/data/letsencrypt:/etc/letsencrypt
    networks:
      - homelab

networks:
  homelab:
    external: true
