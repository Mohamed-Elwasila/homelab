services:
  kavita:
    image: jvmilazz0/kavita:0.9.1
    container_name: kavita
    restart: always
    ports:
      - "5000:5000"
    volumes:
      - ../../data/kavita:/kavita/config
      - ${BOOKS_PATH:-../../data/books}:/books:ro
    networks:
      - homelab

networks:
  homelab:
    external: true
