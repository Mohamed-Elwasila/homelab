services:
  homepage:
    image: ghcr.io/gethomepage/homepage:v2.6.0
    container_name: homepage
    restart: always
    ports:
      - "3000:3000"
    volumes:
      - ../../data/homepage:/app/config
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      HOMEPAGE_ALLOWED_HOSTS: ${HOMEPAGE_ALLOWED_HOSTS:-localhost:3000}
    networks:
      - homelab

networks:
  homelab:
    external: true
