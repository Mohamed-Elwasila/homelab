services:
  portainer:
    image: portainer/portainer-ce:2.45.2
    container_name: portainer
    restart: always
    ports:
      - "9000:9000"
      - "9443:9443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ../../data/portainer:/data
    networks:
      - homelab

networks:
  homelab:
    external: true

