version: "3"

services:
  uptime-kuma:
    image: louislam/uptime-kuma:latest
    container_name: uptime-kuma
    restart: always
    ports:
      - "3001:3001"
    volumes:
      - /home/mujtaba/homelab/data/uptime-kuma:/app/data
    networks:
      - homelab

networks:
  homelab:
    external: true
